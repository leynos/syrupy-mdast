[manifest]
body = '''[snapshot-contract]
contract-version = 1
wenmode = ">=0.15.2,<0.16.0"
parser = "Parser(github(), positions=False)"
file-extension = "mdast.json"
normalization = ["remove-position", "order-members"]
key-order = ["type", "children"]

[snapshot-contract.json-writer]
encoding = "utf-8"
byte-order-mark = false
ensure-ascii = false
indent = 2
item-separator = ","
key-separator = ": "
allow-nan = false
sort-keys = false
trailing-newline = true
'''

