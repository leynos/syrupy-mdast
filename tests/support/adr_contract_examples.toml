[status_examples]
accepted = "## Status\n\nAccepted (2027-01-01): chosen.\n\tAccepted"
proposed = "## Status\n\nProposed\n\tProposed"
proposed-punctuation = "## Status\n\nProposed.\n\tProposed"
superseded = """## Status

Superseded (2027-01-01) by ADR-005.
\tSuperseded (2027-01-01) by ADR-005."""
missing-status = "## Context\n\nNo status.\n\t"
empty-status = "## Status\n\n## Date\n\t"

[key_order_examples]
duplicate = "type value data data children"
position = "type position value data children"
wrong-first = "depth type value data children"
wrong-last = "type value data children depth"
data-after-children = "type value children data"

[writer_examples]
misordered = '''{
  "children": [],
  "type": "root"
}
'''
misindented = '''{"type": "root", "children": []}
'''
adjacent-text = '''{
  "type": "root",
  "children": [
    {
      "type": "text",
      "value": "a"
    },
    {
      "type": "text",
      "value": "b"
    }
  ]
}
'''
metadata-text = '''{
  "type": "root",
  "children": [
    {
      "type": "text",
      "data": {
        "escaped": true
      },
      "value": "a"
    },
    {
      "type": "text",
      "value": "b"
    }
  ]
}
'''

[cases]
policy = "accepted proposed-policy removed-backlink stale-backlink stale-policy-link"
status = "accepted proposed proposed-punctuation superseded missing-status empty-status"
manifest = "no-block two-blocks wrong-heading invalid-toml missing-key extra-key wrong-type"
writer = "misordered misindented adjacent-text metadata-text"
