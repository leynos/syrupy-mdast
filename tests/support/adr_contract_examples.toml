writer = "root-scalar non-root missing-children wrong-children scalar-values float-value misordered misindented adjacent-text metadata-text"
key_order = "duplicate position wrong-first wrong-last data-after-children"
discovery = "actual quoted backtick-fenced tilde-fenced duplicate unterminated-fence"
links = "current backtick-fenced tilde-fenced mixed inline-code-only image-only unmatched-backtick inline-code-label html-comment-only unterminated-comment comment-with-backticks-before-real-link code-span-with-comment-opener-before-real-link"

