[status_examples]
accepted = "## Status\n\nAccepted (2027-01-01): chosen.\n\tAccepted"
proposed = "## Status\n\nProposed\n\tProposed"
proposed-punctuation = "## Status\n\nProposed.\n\tProposed"
superseded = """## Status

Superseded (2027-01-01) by ADR-005.
\tSuperseded (2027-01-01) by ADR-005."""
missing-status = "## Context\n\nNo status.\n\t"
empty-status = "## Status\n\n## Date\n\t"

[key_order_examples]
duplicate = "type value data data children"
position = "type position value data children"
wrong-first = "depth type value data children"
wrong-last = "type value data children depth"
data-after-children = "type value children data"

[writer_examples]
root-scalar = "42\n"
non-root = '''{
  "type": "paragraph",
  "children": []
}
'''
missing-children = '''{
  "type": "root"
}
'''
wrong-children = '''{
  "type": "root",
  "children": false
}
'''
scalar-values = '''{
  "type": "root",
  "children": [
    true,
    1,
    null,
    "é"
  ]
}
'''
float-value = '''{
  "type": "root",
  "children": [
    1.5
  ]
}
'''
misordered = '''{
  "children": [],
  "type": "root"
}
'''
misindented = '''{"type": "root", "children": []}
'''
adjacent-text = '''{
  "type": "root",
  "children": [
    {
      "type": "text",
      "value": "a"
    },
    {
      "type": "text",
      "value": "b"
    }
  ]
}
'''
metadata-text = '''{
  "type": "root",
  "children": [
    {
      "type": "text",
      "data": {
        "escaped": true
      },
      "value": "a"
    },
    {
      "type": "text",
      "value": "b"
    }
  ]
}
'''

[cases]
parser = "current called-single called-multiline uncalled-single uncalled-multiline"
policy = "accepted proposed-policy removed-backlink stale-backlink stale-policy-link"
status = "accepted proposed proposed-punctuation superseded missing-status empty-status"
manifest = "no-block two-blocks wrong-heading invalid-toml missing-key extra-key wrong-type"
writer = "root-scalar non-root missing-children wrong-children scalar-values float-value misordered misindented adjacent-text metadata-text"
key_order = "duplicate position wrong-first wrong-last data-after-children"

[rules]
allowed = "remove-position remove-empty-data merge-plain-text normalize-line-endings order-members"

[parser_examples]
current = "\tclean"
called-single = "Parser(github(), positions=False)\n\tclean"
called-multiline = "Parser(\n    github(),\n    positions=False,\n)\n\tclean"
uncalled-single = "Parser(github, positions=False)\n\tuncalled"
uncalled-multiline = "Parser(\n    github,\n    positions=False,\n)\n\tuncalled"
