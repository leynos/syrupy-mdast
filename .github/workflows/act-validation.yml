name: Act Validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  act-validation:
    runs-on: ubuntu-latest
    env:
      ACT_VERSION: v0.2.84
      MARKDOWNLINT_CLI2_VERSION: 0.22.1
      MBAKE_VERSION: 1.4.6
      # Pin the Makefile parser used by the contract tests; this job runs
      # the full pytest suite, so it provisions Makeutil independently.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      
      - name: Install act
        run: |
          act_archive=act_Linux_x86_64.tar.gz
          act_url="https://github.com/nektos/act/releases/download/${ACT_VERSION}/${act_archive}"
          curl -fsSLo "${act_archive}" "${act_url}"
          act_sha256="$(
            curl -fsSL "https://api.github.com/repos/nektos/act/releases/tags/${ACT_VERSION}" |
              python -c 'import json, sys; release = json.load(sys.stdin); print(next(asset["digest"].split(":", 1)[1] for asset in release["assets"] if asset["name"] == "act_Linux_x86_64.tar.gz"))'
          )"
          printf '%s  %s\n' "${act_sha256}" "${act_archive}" | sha256sum -c -
          sudo tar -xzf "${act_archive}" -C /usr/local/bin act
          npm install -g "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"
          uv tool install "mbake==${MBAKE_VERSION}"

      - name: Check Docker runtime
        run: docker info

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Run tests with act validation
        run: make test WITH_ACT=1
