name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # Read-only: every tool this job runs (checkout, mbake, makeutil, uv, the
    # linters) either needs no repository write or authenticates with its own
    # token. Pinning the token stops a compromised step from
    # inheriting write access it never uses.
    permissions:
      contents: read
    env:
      # Pin ruff and ty to the versions declared in the Makefile
      # (RUFF_VERSION/TY_VERSION) and pyproject.toml. Make reads these
      # environment variables, so CI and local runs invoke identical tool
      # releases. tests/test_toolchain_contract.py keeps the sites in sync;
      # bump them together.
      RUFF_VERSION: 0.16.4
      TY_VERSION: 0.0.74
      
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run lint, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      # The only test execution on this lane: measuring and testing in one
      # instrumented run costs one compile instead of two. `with-ratchet` fails
      # the run when total line coverage falls below the baseline
      # coverage-main.yml saves on main, so the pull-request coverage decision
      # is that local ratchet rather than a CodeScene check. On a push to main
      # this step is skipped: coverage-main.yml measures main and is the one
      # baseline writer and the one CodeScene publisher. Pull requests never
      # contact CodeScene. `make test-workflow-contracts` holds the shape.
      - name: Test and Measure Coverage
        if: github.event_name == 'pull_request'
        # generate-coverage builds its own venv with `uv venv`, which takes the
        # newest Python uv can find. `make lint` downloads CPython 3.14 for its
        # tools, so without this pin the pull-request lane measured under 3.14
        # while the publisher measured under 3.13, and the two count lines
        # differently. Both lanes pin one interpreter; the contract holds it.
        env:
          UV_PYTHON: '3.13'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          python-source: ./syrupy_mdast
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: syrupy-mdast
          with-ratchet: 'true'
          publish-artefact: 'false'

  compatibility-matrix:
    name: py${{ matrix.python-version }} / syrupy ${{ matrix.syrupy-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        syrupy-version: ['5.0.0', 'latest']
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pin the declared Syrupy floor
        if: matrix.syrupy-version != 'latest'
        run: uv pip install "syrupy==${{ matrix.syrupy-version }}"

      - name: Upgrade to the newest supported Syrupy release
        if: matrix.syrupy-version == 'latest'
        run: uv pip install --upgrade "syrupy<7.0.0"

      - name: Run package contract tests
        run: |
          uv run --no-sync pytest -v \
            tests/test_public_api_contract.py \
            tests/test_error_contract.py \
            tests/test_package_manifest_contract.py \
            tests/test_core_import_boundary.py
