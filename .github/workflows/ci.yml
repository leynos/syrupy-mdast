name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      # Pin ruff and ty to the versions declared in the Makefile
      # (RUFF_VERSION/TY_VERSION) and pyproject.toml. Make reads these
      # environment variables, so CI and local runs invoke identical tool
      # releases. tests/test_toolchain_contract.py keeps the sites in sync;
      # bump them together.
      RUFF_VERSION: 0.16.4
      TY_VERSION: 0.0.74
      # Pin the Makefile parser used by the contract tests. Bump the
      # revision and its nightly toolchain together; the contract tests
      # assert both pins and the installation command.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          # The trusted pull-request CodeScene gate needs the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run lint, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@296dc4aa07acf3a7f60a54fb6bccb5672a597479
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: syrupy-mdast
          

      - name: Preflight CodeScene token for trusted pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          if [ -z "$CS_ACCESS_TOKEN" ]; then
            echo "::error title=CodeScene token required::CS_ACCESS_TOKEN is empty for a trusted pull request. Configure the repository secret before requesting the CodeScene changed-line coverage gate."
            exit 1
          fi

      - name: Upload main coverage to CodeScene
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@395f8e8630d431abb4a136847f1c14c4ad5a0ccc
        with:
          mode: upload
          path: coverage.xml
          format: cobertura
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Check trusted pull request coverage with CodeScene
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@395f8e8630d431abb4a136847f1c14c4ad5a0ccc
        with:
          mode: check
          path: coverage.xml
          format: cobertura
          project-url: https://api.codescene.io/v2/projects/82582
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}

      - name: Skip CodeScene coverage gate for fork pull requests
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice title=CodeScene coverage gate skipped::Fork pull requests do not receive CS_ACCESS_TOKEN, so the external CodeScene gate is intentionally not invoked."

  compatibility-matrix:
    name: py${{ matrix.python-version }} / syrupy ${{ matrix.syrupy-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        syrupy-version: ['5.0.0', 'latest']
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pin the declared Syrupy floor
        if: matrix.syrupy-version != 'latest'
        run: uv pip install "syrupy==${{ matrix.syrupy-version }}"

      - name: Upgrade to the newest supported Syrupy release
        if: matrix.syrupy-version == 'latest'
        run: uv pip install "syrupy<7.0.0"

      - name: Run package contract tests
        run: |
          uv run --no-sync pytest -v \
            tests/test_public_api_contract.py \
            tests/test_error_contract.py \
            tests/test_package_manifest_contract.py \
            tests/test_core_import_boundary.py
