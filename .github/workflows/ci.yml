name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 }}
      # Pin ruff and ty to the versions declared in the Makefile
      # (RUFF_VERSION/TY_VERSION) and pyproject.toml. Make reads these
      # environment variables, so CI and local runs invoke identical tool
      # releases. tests/test_toolchain_contract.py keeps the sites in sync;
      # bump them together.
      RUFF_VERSION: 0.16.4
      TY_VERSION: 0.0.74
      # Pin the Makefile parser used by the contract tests. Bump the
      # revision and its nightly toolchain together; the contract tests
      # assert both pins and the installation command.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Run lint, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@bffacaf91d3f3515110679a30fbf6dc781ddc549
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: syrupy-mdast
          

      - name: Install CodeScene Coverage CLI
        if: env.CS_ACCESS_TOKEN != ''
        run: |
          curl -fsSL --output install-cs-coverage-tool.sh \
            https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
          if [ -n "${CODESCENE_CLI_SHA256:-}" ]; then
            echo "${CODESCENE_CLI_SHA256}  install-cs-coverage-tool.sh" | sha256sum -c -
          else
            echo "::notice::CODESCENE_CLI_SHA256 is not set; skipping installer checksum verification"
          fi
          bash install-cs-coverage-tool.sh -y

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        run: |
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found!"
            exit 1
          fi
          cs-coverage upload \
            --format "cobertura" \
            --metric "line-coverage" \
            coverage.xml
