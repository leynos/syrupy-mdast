name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # Read-only: every tool this job runs (checkout, mbake, makeutil, uv, the
    # linters, CodeScene) either needs no repository write or authenticates
    # with its own token. Pinning the token stops a compromised step from
    # inheriting write access it never uses.
    permissions:
      contents: read
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      # Pin ruff and ty to the versions declared in the Makefile
      # (RUFF_VERSION/TY_VERSION) and pyproject.toml. Make reads these
      # environment variables, so CI and local runs invoke identical tool
      # releases. tests/test_toolchain_contract.py keeps the sites in sync;
      # bump them together.
      RUFF_VERSION: 0.16.4
      TY_VERSION: 0.0.74
      # Pin the Makefile parser used by the contract tests. Bump the
      # revision and its nightly toolchain together; the contract tests
      # assert both pins and the installation command.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
      
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      
      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run lint, including Skylos dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Audit dependencies
        run: make audit

      # The only test execution on this lane: measuring and testing in one
      # instrumented run costs one compile instead of two. `with-ratchet` fails
      # the run when total line coverage falls below the baseline the default
      # branch last saved, so the pull-request coverage decision is that local
      # ratchet rather than a CodeScene check. GitHub scopes a baseline a pull
      # request saves to its merge ref, which the default branch cannot read,
      # so the two events cannot race for it.
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@296dc4aa07acf3a7f60a54fb6bccb5672a597479
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: syrupy-mdast
          with-ratchet: 'true'
          

      # Main is the only CodeScene consumer. CodeScene accepts `cs-coverage
      # upload` only for analysed branches, so the report this job generates on
      # a default-branch push is published here. Pull requests neither publish
      # a report nor contact CodeScene: they enforce coverage locally, through
      # the ratchet that `Test and Measure Coverage` compares against the
      # baseline this job saves. The `event_name == 'push'` term already keeps
      # every pull request away from this step; the `env.CS_ACCESS_TOKEN != ''`
      # guard is deliberate defence in depth, so that even a mistaken future
      # widening of the condition skips the step rather than invoking the
      # external action without a token.
      #
      # No checksum input is passed. The action verifies the CLI archive it
      # downloads against `archive_sha256` in its own `cli-manifest.json` on
      # every run, so a caller-supplied digest would only restate a value the
      # action already holds — and could only ever disagree with it by being
      # stale. Passing nothing leaves that single source of truth intact.
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          format: cobertura
          mode: upload
          path: coverage.xml
          access-token: ${{ env.CS_ACCESS_TOKEN }}

  compatibility-matrix:
    name: py${{ matrix.python-version }} / syrupy ${{ matrix.syrupy-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        syrupy-version: ['5.0.0', 'latest']
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Pin the declared Syrupy floor
        if: matrix.syrupy-version != 'latest'
        run: uv pip install "syrupy==${{ matrix.syrupy-version }}"

      - name: Upgrade to the newest supported Syrupy release
        if: matrix.syrupy-version == 'latest'
        run: uv pip install --upgrade "syrupy<7.0.0"

      - name: Run package contract tests
        run: |
          uv run --no-sync pytest -v \
            tests/test_public_api_contract.py \
            tests/test_error_contract.py \
            tests/test_package_manifest_contract.py \
            tests/test_core_import_boundary.py
