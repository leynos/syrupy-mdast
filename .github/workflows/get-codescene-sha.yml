name: Refresh CodeScene CLI SHA256

on:
  workflow_dispatch:

jobs:
  refresh-sha:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # The digest CI verifies is the `archive_sha256` the shared action's
      # manifest records for its pinned `cli-version`, not a digest of the
      # upstream installer script. The action compares `archive-checksum`
      # against the manifest value and fails the run when the two differ, so
      # publishing any other artifact's digest here would break every upload
      # the moment this variable was populated.
      - name: Read the manifest digest & record it
        id: compute
        run: |
          set -euo pipefail
          # Same immutable revision `ci.yml` pins the action at. Bump the two
          # together: the manifest is a function of the action revision, so a
          # digest read from a different revision could name an archive that
          # the pinned action does not resolve.
          action_sha='a5765019912a8ab6882b12db049c7cde635f3a85'
          action_dir='.github/actions/upload-codescene-coverage'
          url="https://raw.githubusercontent.com/leynos/shared-actions/${action_sha}/${action_dir}/cli-manifest.json"
          curl -fsSL --proto '=https' --tlsv1.2 "$url" -o cli-manifest.json
          # `--exit-status` fails the step when the path is absent or null, so
          # a manifest that lost its digest cannot publish an empty value.
          sha="$(jq --raw-output --exit-status '.releases[0].archive_sha256' cli-manifest.json)"
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{64}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            printf '### CodeScene CLI archive digest\n\n'
            printf -- '- manifest: `%s`\n' "$url"
            printf -- '- archive SHA-256: `%s`\n' "$sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Update repository variable
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          script: |
            const sha = process.env.SHA
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'CODESCENE_CLI_SHA256',
              value: sha,
            })
        env:
          SHA: ${{ steps.compute.outputs.sha }}
