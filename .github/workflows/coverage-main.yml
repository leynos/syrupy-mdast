name: Coverage (main)

# The one CodeScene publisher. CodeScene accepts `cs-coverage upload` only
# for analysed branches, so main's coverage is uploaded here after each
# merge; pull requests measure coverage and ratchet it in ci.yml without
# talking to CodeScene at all. This workflow also writes the ratchet
# baseline: caches saved on main are readable by every pull-request run,
# so the baseline written here is the one each pull request is compared
# against, and ci.yml's generate-coverage selection has to match the one
# below field for field. tests/test_codescene_repository.py holds that
# shape.
#
# Known exceptions. Merges the Dependabot automerge workflow makes with
# GITHUB_TOKEN fire no push event, so they reach this workflow only through
# a later push or a dispatch. A dispatch that replaces a pending push
# uploads the same or a newer commit, but generate-coverage saves the
# ratchet baseline only on a push, so the baseline can lag by more than one
# commit until a later push saves it.

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One group per ref, never cancelled. Runs for main never overlap, and
# GitHub keeps at most one pending run per group, so a newer trigger replaces
# an older pending run rather than queueing behind it. GitHub does not promise
# to start runs in trigger order, so this is not a guarantee of commit order.
# A manual re-run of an older run keeps its SHA and its run id: it republishes
# that commit's coverage to CodeScene, but its baseline cache key already
# exists, so it replaces no baseline unless the original run saved none. A
# cancelled run would abandon both its upload and its baseline write.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The suite needs the Makefile parser; keep this pin with ci.yml's.
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install CLI tools
        run: |
          for tool in mbake; do uv tool install ${tool}; done

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Install code
        run: make build

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: syrupy-mdast
          with-ratchet: 'true'

      # The expression is evaluated before the shell starts, so this step
      # binds no secret and holds no shell conditional. With no
      # CS_ACCESS_TOKEN secret, as on a fork, the upload below skips.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # No checksum input is passed. The action verifies the CLI archive it
      # downloads against `archive_sha256` in its own `cli-manifest.json` on
      # every run, so a caller-supplied digest would only restate a value the
      # action already holds, and could only ever disagree with it by being
      # stale.
      - name: Upload coverage data to CodeScene
        # The ref as well as the token: a dispatch can name any branch, and
        # without this guard it would upload that branch's coverage as
        # main's. The token goes straight to the input rather than through
        # `env`, which the composite uploader would hand to its nested steps.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
